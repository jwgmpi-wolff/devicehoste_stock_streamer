name: Validate StockStream Local APK

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build APK without embedded provider credentials
        shell: pwsh
        run: .\gradlew.bat :app:testDebugUnitTest :app:assembleDebug --console=plain
